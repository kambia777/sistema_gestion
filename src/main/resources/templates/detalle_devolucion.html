<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle Devolución</title>
</head>
<body>

<h1>Detalle de Devolución</h1>

<p><b>ID:</b> <span th:text="${devolucion.id}"></span></p>
<p><b>Fecha:</b> <span th:text="${devolucion.fecha}"></span></p>
<p><b>Venta:</b> <span th:text="${devolucion.venta.id}"></span></p>
<p><b>Motivo:</b> <span th:text="${devolucion.motivo}"></span></p>

<h2>Productos devueltos</h2>

<table border="1">
    <tr>
        <th>Polo</th>
        <th>Talla</th>
        <th>Color</th>
        <th>Cantidad</th>
    </tr>

    <tr th:each="d : ${devolucion.detalles}">
        <td th:text="${d.polo.nombre}"></td>
        <td th:text="${d.talla.nombre}"></td>
        <td th:text="${d.color.nombre}"></td>
        <td th:text="${d.cantidad}"></td>
    </tr>
</table>

<br>
<a href="/devoluciones">⬅ Volver</a>

</body>
</html>
