<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sistema de Gestión</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body style="background-color:#f5f6fa;">

<div class="container mt-5">

    <h1 class="text-center mb-5">📦 Sistema de Gestion</h1>

    <div class="row g-4">

        <!-- PRODUCCIÓN -->
        <div class="col-md-4">
            <a href="/ordenes" class="text-decoration-none">
                <div class="card text-center shadow-lg p-4">
                    <i class="bi bi-gear-fill fs-1 text-primary"></i>
                    <h4 class="mt-3">Producción</h4>
                    <p>Gestionar órdenes de producción</p>
                </div>
            </a>
        </div>

        <!-- ENTRADAS -->
        <div class="col-md-4">
            <a href="/entradas" class="text-decoration-none">
                <div class="card text-center shadow-lg p-4">
                    <i class="bi bi-box-arrow-in-down fs-1 text-success"></i>
                    <h4 class="mt-3">Entradas</h4>
                    <p>Ingreso a almacén</p>
                </div>
            </a>
        </div>

        <!-- SALIDAS -->
        <div class="col-md-4">
            <a href="/salidas" class="text-decoration-none">
                <div class="card text-center shadow-lg p-4">
                    <i class="bi bi-box-arrow-up fs-1 text-danger"></i>
                    <h4 class="mt-3">Salidas</h4>
                    <p>Envío a tiendas</p>
                </div>
            </a>
        </div>

        <!-- VENTAS -->
        <div class="col-md-4">
            <a href="/ventas" class="text-decoration-none">
                <div class="card text-center shadow-lg p-4">
                    <i class="bi bi-cash-stack fs-1 text-warning"></i>
                    <h4 class="mt-3">Ventas</h4>
                    <p>Registro de ventas</p>
                </div>
            </a>
        </div>

        <!-- DEVOLUCIONES -->
        <div class="col-md-4">
            <a href="/devoluciones" class="text-decoration-none">
                <div class="card text-center shadow-lg p-4">
                    <i class="bi bi-arrow-counterclockwise fs-1 text-secondary"></i>
                    <h4 class="mt-3">Devoluciones</h4>
                    <p>Gestión de devoluciones</p>
                </div>
            </a>
        </div>

        <!-- STOCK -->
        <div class="col-md-4">
            <a href="/stock" class="text-decoration-none">
                <div class="card text-center shadow-lg p-4">
                    <i class="bi bi-bar-chart-fill fs-1 text-dark"></i>
                    <h4 class="mt-3">Stock</h4>
                    <p>Ver inventario total</p>
                </div>
            </a>
        </div>

    </div>

</div>

</body>
</html>
