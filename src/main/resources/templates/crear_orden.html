<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear Orden</title>
</head>
<body>

<h1>Nueva Orden de Producción</h1>

<form action="/ordenes" method="post" onsubmit="return validarFormulario()">

    <!-- ===================== -->
    <!-- DATOS DE LA ORDEN -->
    <!-- ===================== -->

    <label>Fecha:</label>
    <input type="date" name="fecha"><br><br>

    <label>Responsable:</label>
    <input type="text" name="responsable"><br><br>

    <label>Estado:</label>
    <select name="estado">
        <option value="Pendiente">Pendiente</option>
        <option value="Completada">Completada</option>
    </select><br><br>

    <label>Observaciones:</label>
    <input type="text" name="observaciones"><br><br>

    <!-- ===================== -->
    <!-- DETALLES -->
    <!-- ===================== -->

    <h2>Detalles de Producción</h2>

    <table border="1" id="tablaDetalles">
        <tr>
            <th>Polo</th>
            <th>Talla</th>
            <th>Color</th>
            <th>Cantidad</th>
			<th>Acciones</th>
        </tr>
    </table>

    <br>

    <button type="button" onclick="agregarFila()">➕ Agregar detalle</button>

    <br><br>

    <button type="submit">Guardar Orden</button>

</form>

<br>
<a href="/ordenes">Volver</a>

<!-- ===================== -->
<!-- DATOS DESDE BACKEND -->
<!-- ===================== -->

<script th:inline="javascript">
	/*<![CDATA[*/

	let polos = /*[[${polos}]]*/ [];
	let tallas = /*[[${tallas}]]*/ [];
	let colores = /*[[${colores}]]*/ [];

	let index = /*[[${orden.detalles.size()}]]*/ 0;

	/*]]>*/
</script>

<!-- ===================== -->
<!-- JS DINÁMICO -->
<!-- ===================== -->

<script>


function generarOpciones(lista) {
    let opciones = '<option value="">Seleccione</option>';
    lista.forEach(item => {
        opciones += `<option value="${item.id}">${item.nombre}</option>`;
    });
    return opciones;
}

function agregarFila() {

    const tabla = document.getElementById("tablaDetalles");

    const fila = `
        <tr>
            <td>
                <select name="detalles[${index}].polo.id">
                    ${generarOpciones(polos)}
                </select>
            </td>

            <td>
                <select name="detalles[${index}].talla.id">
                    ${generarOpciones(tallas)}
                </select>
            </td>

            <td>
                <select name="detalles[${index}].color.id">
                    ${generarOpciones(colores)}
                </select>
            </td>

            <td>
                <input type="number" name="detalles[${index}].cantidad" min="1">
            </td>
			
			<td>
			    <button type="button" onclick="eliminarFila(this)">❌</button>
			</td>
        </tr>
    `;

    tabla.insertAdjacentHTML('beforeend', fila);
    index++;
}

function reindexar() {
    const filas = document.querySelectorAll("#tablaDetalles tr");

    let newIndex = 0;

    filas.forEach((fila, i) => {
        if (i === 0) return; // header

        const selects = fila.querySelectorAll("select");
        const input = fila.querySelector("input");

        if (selects.length > 0) {
            selects[0].name = `detalles[${newIndex}].polo.id`;
            selects[1].name = `detalles[${newIndex}].talla.id`;
            selects[2].name = `detalles[${newIndex}].color.id`;
        }

        if (input) {
            input.name = `detalles[${newIndex}].cantidad`;
        }

        newIndex++;
    });

    index = newIndex;
}

function eliminarFila(boton) {
    boton.parentNode.parentNode.remove();
    reindexar();
}

function validarFormulario() {

    const filas = document.querySelectorAll("#tablaDetalles tr").length;

    // restamos la cabecera
    if (filas <= 1) {
        alert("Debes agregar al menos un detalle");
        return false;
    }

    return true;
}
</script>

</body>
</html>
