<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ventas</title>
</head>
<body>

<h1>Lista de Ventas</h1>

<a href="/ventas/nueva">➕ Nueva Venta</a>
<br><br>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Fecha</th>
        <th>Tienda</th>
        <th>Total</th>
        <th>Acción</th>
    </tr>

    <tr th:each="v : ${ventas}">
        <td th:text="${v.id}"></td>
        <td th:text="${v.fecha}"></td>
        <td th:text="${v.tienda.nombre}"></td>
        <td th:text="${v.total}"></td>
        <td>
            <a th:href="@{'/ventas/' + ${v.id}}">Ver</a>
        </td>
    </tr>
</table>

</body>
</html>
