services:

  mysql:
    image: mysql:8.0
    container_name: mysql-sistema
    environment:
      MYSQL_ROOT_PASSWORD: 2De897e77777
      MYSQL_DATABASE: sistema_gestion
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    image: sistema-gestion
    container_name: sistema-gestion
    depends_on:
      - mysql
    ports:
      - "8080:8080"

volumes:
  mysql_data: